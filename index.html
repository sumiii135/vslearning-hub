<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VS Learning Hub – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<!-- Background -->
<div class="bg" id="bg">
  <div class="stars" id="stars"></div>
  <!-- Bats -->
  <div class="bat" style="--fd:14s;--fy:-40px;top:18%;">🦇</div>
  <div class="bat" style="--fd:19s;--fy:30px;top:35%;animation-delay:-6s;">🦇</div>
  <div class="bat" style="--fd:11s;--fy:-20px;top:55%;animation-delay:-3s;">🦇</div>
  <div class="bat" style="--fd:22s;--fy:50px;top:8%;animation-delay:-10s;">🦇</div>
  <!-- Fog -->
  <div class="fog-layer" style="--ff:12s;opacity:0.7;"></div>
  <div class="fog-layer" style="--ff:18s;animation-delay:-5s;opacity:0.4;height:120px;"></div>
  <!-- Orbs -->
  <div class="orb" style="--pd:6s;width:300px;height:300px;background:#4a0080;top:-80px;left:-60px;"></div>
  <div class="orb" style="--pd:8s;width:250px;height:250px;background:#800030;bottom:-60px;right:-40px;animation-delay:-3s;"></div>
</div>

<!-- Card -->
<div class="wrapper">
  <div class="card">

    <div class="skull-wrap"><span class="skull-icon">💀</span></div>
    <div class="site-name">VS Learning Hub</div>
    <div class="site-sub">Enter if you dare…</div>

    <hr class="divider"/>

    <!-- Login form -->
    <div id="loginForm">
      <div class="error-msg" id="errMsg">⚠️ Wrong password! The spirits deny you entry.</div>

      <div class="field">
        <label>� Username (optional)</label>
        <input type="text" id="nameInput" placeholder="Enter your name or username" autocomplete="off"/>
      </div>

      <div class="field">
        <label>📧 Email Address (optional)</label>
        <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="off"/>
      </div>

      <div class="field">
        <label>🔒 Password</label>
        <input type="password" id="pwInput" placeholder="Enter the secret…" autocomplete="off"/>
        <div class="pw-note">🕯️ Password is fixed for all users</div>
      </div>

      <button class="btn" onclick="doLogin()">
        <span>🕸️ Enter the Darkness</span>
      </button>
    </div>

    <!-- Success state -->
    <div class="success-overlay" id="successBox">
      <div class="success-icon">🎃</div>
      <div class="success-text">Welcome, Brave Soul!</div>
      <div class="success-sub">You have entered VS Learning Hub…</div>
    </div>

    <div class="footer-note">
      🕷️ Powered by <span>VS Learning Hub</span> · All souls reserved
    </div>
  </div>
</div>

<script>
  // ── Generate stars ──
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      --d:${(Math.random()*3+1.5).toFixed(1)}s;
      animation-delay:${(Math.random()*4).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  // ── Login logic ──
  const FIXED_PASSWORD = '25082005';

  function getUsers() {
    try {
      return JSON.parse(localStorage.getItem('vsLearningUsers') || '[]');
    } catch (e) {
      return [];
    }
  }

  function saveUserIdentity(email, username) {
    const users = getUsers();
    const normalizedEmail = email ? email.trim().toLowerCase() : '';
    const finalUsername = (username || '').trim() ||
      (normalizedEmail ? normalizedEmail.split('@')[0] : `Guest-${Math.floor(Math.random() * 9000 + 1000)}`);

    const entry = {
      name: finalUsername,
      email: normalizedEmail,
      loggedAt: new Date().toISOString()
    };

    const existingIndex = users.findIndex(user => user.email && normalizedEmail && user.email.toLowerCase() === normalizedEmail);
    if (existingIndex >= 0) {
      users[existingIndex] = { ...users[existingIndex], ...entry, name: finalUsername };
    } else {
      users.unshift(entry);
    }

    localStorage.setItem('vsLearningUsers', JSON.stringify(users.slice(0, 50)));
    localStorage.setItem('vsCurrentUserName', finalUsername);
    localStorage.setItem('vsCurrentUserEmail', normalizedEmail);
  }

  function doLogin() {
    const email = document.getElementById('emailInput').value.trim();
    const username = document.getElementById('nameInput').value.trim();
    const pw    = document.getElementById('pwInput').value;
    const err   = document.getElementById('errMsg');
    const form  = document.getElementById('loginForm');
    const succ  = document.getElementById('successBox');

    if (email && !email.includes('@')) {
      err.textContent = '⚠️ Please enter a valid email address or leave it blank.';
      err.classList.add('visible');
      return;
    }

    if (pw !== FIXED_PASSWORD) {
      err.textContent = '⚠️ Wrong password! The spirits deny you entry.';
      err.classList.add('visible');
      document.getElementById('pwInput').value = '';
      return;
    }

    // Success
    err.classList.remove('visible');
    form.style.display = 'none';
    succ.classList.add('visible');

    saveUserIdentity(email, username);
    localStorage.setItem('isLoggedIn', 'true');

    // Redirect to hub after short delay so user sees success UI briefly
    setTimeout(() => {
      window.location.href = "index.html";
    }, 600);
  }

  // Allow Enter key
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // Hide error on typing
  document.getElementById('pwInput').addEventListener('input', () => {
    document.getElementById('errMsg').classList.remove('visible');
  });
</script>
</body>
</html>
